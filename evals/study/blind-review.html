<script>
const items=[{"id": "W01", "task": "Explain why evidence matters in public debate. Write about 250 words.", "options": [{"slot": "A", "text": "In public debate, evidence serves as the foundation upon which arguments are built and evaluated. Its importance cannot be overstated because it provides a basis for credibility and objectivity. Without evidence, arguments can easily become subjective and open to interpretation, which can lead to a lack of consensus and a failure to reach a rational conclusion. Evidence ensures that the discussion remains grounded in facts, making it easier for individuals to assess the validity of claims and the strength of the arguments presented.\n\nMoreover, evidence helps in identifying and addressing the weaknesses in an argument. When presented with facts that contradict a position, it becomes easier to challenge the validity of the argument and construct a rebuttal. This process not only strengthens the debate but also ensures that the discourse is based on a common ground of truth. The use of evidence also makes the debate more transparent and less prone to being dismissed as personal attacks or emotional appeals.\n\nIn summary, the inclusion of evidence in public debate is crucial for maintaining a rational and objective discussion. It prevents the debate from being dominated by personal opinions and biases, ensuring that the focus remains on the facts and the logical structure of the arguments."}, {"slot": "B", "text": "The objective of the series at FrameTheGlobeNews.com underscores the importance of evidence in public debate. The series reveals how governments and institutions, such as AIPAC, use specific financial resources and media buys to influence elections and political landscapes. For instance, AIPAC's $2 million reservation for ads against Abdul El-Sayed, a candidate who refuses to take their money, demonstrates the intensity of their opposition. This pattern, evident in Michigan and other states, shows that when a candidate does not align with AIPAC's values, they are targeted with significant resources. Similarly, Marco Rubio's four years of building an ideological case for confrontation with Iran, followed by a briefing room when the confrontation occurred, illustrates the power of preconceived narratives and media campaigns. These examples underscore how specific evidence and mechanisms shape public debate and policy decisions. Evidence, whether through financial reserves or media buys, directly impacts the discourse and outcomes in political landscapes."}, {"slot": "C", "text": "In public debate, evidence plays a crucial role in shaping arguments and influencing outcomes. The importance of evidence lies in its ability to provide a foundation for claims and counterarguments. Without solid evidence, arguments can easily become subjective and open to interpretation, leading to confusion and disagreement. Here\u2019s why evidence matters in public debate:\n\n1. **Verification of Claims**: Evidence serves as a means to verify the truthfulness of claims made. It allows participants to assess the validity of arguments based on factual data, statistics, expert opinions, or empirical studies. Without this verification, debates can quickly devolve into personal attacks or unsupported assertions.\n\n2. Breaching Bias: Evidence helps to counteract biases by providing objective information. When individuals base their arguments on personal experiences or emotions rather than objective facts, they can be more easily swayed by emotions. Evidence helps to create a more balanced and rational discussion.\n\n3. **Building Trust**: When participants in a debate present evidence that is widely accepted or supported by multiple sources, they build trust among their audience. This trust is essential for the debate to be taken seriously and for the audience to consider the arguments presented.\n\n4. **Encouraging Critical Thinking**: The requirement to use evidence encourages participants to think critically. It forces them to question assumptions, examine data critically, and consider alternative perspectives. This critical thinking is invaluable in fostering a more informed and nuanced public discourse.\n\n5. **Resolving Conflicts**: In cases where different sides of an issue have differing views, evidence can help resolve conflicts by providing a common ground. It allows for a more structured and logical resolution of disputes based on shared information rather than differing opinions.\n\nIn essence, evidence acts as a bridge between subjective opinions and objective truth. It ensures that public debates are grounded in facts and rational arguments, making them more productive and constructive."}]}, {"id": "W02", "task": "Write about the role of accountability in political power. Write about 250 words.", "options": [{"slot": "A", "text": "Accountability in political power is eroded when institutions and mechanisms are used repeatedly without consequence. In Pakistan, the military's role in governance and foreign policy is not contingent on popular mandate but on the current army chief's strategic calculation. The current government's mandate is not popular, and this matters for Pakistan's status as a middle power. The country's mediation efforts in the 2026 Iran conflict were based on the army chief's interests, not on the legitimacy of the system. Similarly, the press freedom in Pakistan is compromised by the state's close control over digital speech and surveillance infrastructure. Without accountability, the system produces compliance, and the press does not investigate what it is paid not to investigate. In the United States, the impeachment process has become a record of actions rather than a check on power. The repeated use of the mechanism without consequence changes its nature. The question of accountability is thus paramount. Without it, the system loses its deterrent weight, and the institution becomes something else. In Pakistan, structural reforms are needed to ensure accountability and transparency in military-linked business conglomerates. Without these reforms, the costs of collusion for elites will outweigh the benefits, and the country's political economy will remain skewed."}, {"slot": "B", "text": "Accountability plays a crucial role in the functioning of political power, ensuring that those who hold positions of authority are held responsible for their actions and decisions. A transparent system of accountability ensures that leaders are not just accountable to their constituents but also to themselves, their institutions, and the law. This accountability serves as a check on the concentration of power, preventing abuses of authority and fostering a culture of responsibility and transparency.\n\nIn a democratic society, accountability is fundamental to the legitimacy of political power. Leaders who are accountable are more likely to act in the best interests of their constituents, as they are more likely to face consequences for actions that harm the public interest. This accountability is not just a matter of public opinion or media scrutiny but also involves formal mechanisms such as oversight bodies, audits, and legal processes.\n\nFor instance, in democracies, elected officials are accountable to their constituents through elections, where they are held responsible for their actions. Beyond this, they are also accountable to various oversight bodies such as parliamentary committees, ombudsmen, and independent commissions. These bodies are tasked with ensuring that the executive branch operates within the law and within the parameters set by the constitution and other governing documents.\n\nFurthermore, accountability mechanisms also extend to the private sector. Political leaders who are accountable to their constituents are more likely to ensure that their actions do not lead to conflicts of interest or the misuse of public funds. This is particularly important in ensuring the efficient and effective use of public resources.\n\nIn essence, accountability in political power is a double-edged sword. It serves as a powerful tool for good governance but also requires robust institutions and a culture that respects the rule of law. Without accountability, the concentration of power can lead to corruption, inefficiency, and a breakdown in the checks and balances that are essential for a functioning democracy."}, {"slot": "C", "text": "Accountability is a cornerstone in the functioning of political power. It ensures that those who hold positions of authority are held responsible for their actions and decisions. A transparent system of accountability allows citizens to hold their elected officials and leaders accountable for the decisions they make during their tenure. This accountability is not just about answering to the public, but it also involves a system of checks and balances that prevent abuse of power.\n\nIn democratic societies, accountability is essential for the legitimacy of political institutions. It prevents the concentration of power in the hands of a few, which can lead to corruption and inefficiency. When political leaders are accountable, they are more likely to make decisions that benefit the public interest, not just their own personal gain. This accountability is not only about answering to the electorate during elections but also about how they conduct themselves in office and how they respond to public concerns.\n\nThe media, independent institutions, and civil society organizations also play critical roles in ensuring accountability. They serve as watchdogs, monitoring the actions of government officials and exposing any instances of corruption or mismanagement. When these institutions operate effectively, they can pressure the government to be more transparent and answerable to its citizens.\n\nIn summary, accountability in political power is not just a theoretical concept but a practical necessity. It ensures that those who hold power are held responsible for their actions, which in turn promotes a more open and just society."}]}, {"id": "W03", "task": "Explain how money influences democratic representation. Write about 250 words.", "options": [{"slot": "A", "text": "Money has a significant influence on democratic representation, affecting how candidates campaign and how issues are debated. Political campaigns require substantial funding, which can come from various sources including corporations, wealthy individuals, and interest groups. This funding can shape the content and style of campaign advertisements, potentially skewing the debate towards issues that benefit the donors rather than the general public. When candidates receive large donations, they may be more inclined to support policies that benefit the donors, rather than the interests of their constituents. This can lead to a situation where elected officials are not always fully aligned with the will of their voters, as their actions are sometimes influenced by the financial backing they receive.\n\nMoreover, the concentration of wealth in politics can create a two-tier system where the voices of the wealthy and their supporters are heard more than those of average citizens. This imbalance can undermine the democratic process, as it does not reflect the true will of the people."}, {"slot": "B", "text": "The influx of money into democratic elections, particularly through organizations like AIPAC, significantly influences the representation of voters. In Michigan, AIPAC's United Democracy Project spent over $30 million to support Representative Haley Stevens' campaign, more than twice the amount raised by her opponent, Abdul El-Sayed. This spending, though not disclosed, demonstrates how outside forces can shape a primary race. Similarly, in Colorado, AIPAC and other pro-Israel groups spent over $2 million in the final weeks of the primary, influencing the outcome. This external funding creates a scenario where the candidate's campaign is not solely driven by their personal positions but by external financial backing. Such practices not only skew the primary process but also limit the electorate's ability to fully engage with the issues and candidates."}, {"slot": "C", "text": "Money significantly influences democratic representation by creating a system where those with more financial resources have a greater voice in the political process. Campaign contributions from wealthy donors and corporations can sway politicians towards their interests, often at the expense of the general public's needs. This is because elected officials may feel pressured to vote in ways that benefit their financial supporters rather than representing the broader electorate.\n\nAdditionally, the cost of running for office is increasing, making it more difficult for candidates from less affluent backgrounds to compete. This can lead to a more homogeneous group of elected officials, furthering the interests of the wealthy and powerful. The influence of money also affects policy decisions, as lobbyists and interest groups funded by donors can exert significant influence on legislation and regulations.\n\nFurthermore, the concentration of wealth can lead to a disconnect between elected officials and their constituents. When representatives are more concerned with the interests of their donors and donors' industries than with the needs of their constituents, it can erode trust in the democratic process. This disconnect can further alienate the general public from the political system, potentially leading to apathy and disengagement from the democratic process.\n\nIn essence, while democratic principles aim to ensure that all voices are heard, the reality is that wealth and its associated influence on the political process can skew this balance."}]}, {"id": "W04", "task": "Draft a concise argument about narrative and public opinion. Write about 250 words.", "options": [{"slot": "A", "text": "Narrative plays a pivotal role in shaping public opinion, acting as a powerful conduit through which societal views and beliefs are formed and disseminated. The narrative, whether it be through media, social platforms, or community conversations, acts as a lens through which individuals interpret and understand complex issues. When narratives are consistent and compelling, they can significantly influence how people perceive and respond to events and policies, often swaying public opinion in favor of or against certain actions.\n\nOn the other hand, when narratives are fragmented or contradictory, they can lead to confusion and division within the public sphere. For instance, during political campaigns, candidates often craft narratives that highlight their strengths and downplay their weaknesses, thereby influencing voter perceptions. Similarly, in the realm of social issues, narratives can either unite communities by emphasizing common values or divide them by highlighting perceived differences.\n\nMoreover, the power of narrative extends beyond influencing individual opinions; it can also shape policy decisions and societal norms. Governments and organizations often use narratives to advocate for their positions, framing issues in a manner that aligns with their interests. This can lead to a self-fulfilling prophecy, where actions taken in response to a particular narrative become the reality that validates the narrative itself.\n\nIn conclusion, the narrative is a potent tool for shaping public opinion. It can either unite or divide, and it is crucial for individuals and groups to be aware of the narratives being propagated to critically assess and respond to them. Understanding the narrative landscape is essential for engaging effectively in public discourse and influencing outcomes."}, {"slot": "B", "text": "When a retired Chief Justice of AJK, Muhammad Azam Khan, questioned the legality of the refugee seats and their impact on the region's political landscape, his words resonated deeply within AJK's political circles. The source's credibility amplified the message, as his position was not novel but rather a reflection of longstanding concerns. Public opinion polls showed stark discrepancies, with only a small percentage believing the seats served unity, while a majority viewed them as tools of manipulation. This divergence underscores the power of institutional mechanisms in shaping public opinion. In contrast, the United States Congress's response to public opinion on military aid to Israel exemplifies how institutional processes can insulate relationships from democratic accountability. When public sentiment shifts, the formal mechanisms of accountability become ineffective due to the distributed nature of expertise and political capacity needed to sustain the relationship. Thus, the divergence between public opinion and congressional action highlights the structural limitations of democratic accountability in complex, interdependent relationships."}, {"slot": "C", "text": "Narrative plays a pivotal role in shaping public opinion. The way a story is told can influence how people perceive and interpret information, making it a powerful tool for communication. A narrative that is crafted to be compelling and emotionally resonant can create a shared experience that people find relatable and memorable. This emotional connection can lead to a more significant impact on public opinion, as individuals are more likely to agree with a story that they find personally meaningful.\n\nFurthermore, narratives can simplify complex issues into digestible parts, making it easier for the public to understand and process information. When presented in a narrative format, people are more likely to accept the message as a whole, rather than critically dissecting each element. This can be particularly effective in political discourse, where narratives can shape public debate and decision-making.\n\nHowever, it is crucial to acknowledge that not all narratives are created equal. The reliability and accuracy of the information within a narrative are paramount. When a narrative is based on factual information and is transparent about its sources, it can have a more lasting impact on public opinion. The challenge for communicators is to balance the emotional appeal of a narrative with the need for factual accuracy to ensure that the message is not only engaging but also credible."}]}, {"id": "W05", "task": "Explain the human consequences of policy decisions. Write about 250 words.", "options": [{"slot": "A", "text": "Policy decisions can have significant and varied impacts on human lives, affecting individuals, communities, and societies in profound ways. These consequences are often multifaceted and far-reaching, influencing everything from economic stability and social welfare to public health and education.\n\nFor instance, economic policies such as tax rates and subsidies can dramatically affect employment levels and income inequality. Lower taxes on corporations and the wealthy can lead to increased profits and higher stock prices but may also result in job losses and reduced public services. Conversely, higher taxes on the rich and lower taxes on the poor can reduce inequality but may discourage investment and job creation. Such decisions can directly impact the livelihoods of millions of people, affecting their purchasing power and access to essential services.\n\nSocial policies, such as welfare programs and education funding, can improve living standards and opportunities for individuals. For example, increasing funding for public schools can lead to better educational outcomes, which in turn can boost economic opportunities and social mobility. However, cuts to these programs can exacerbate poverty and educational disparities, leaving many without the resources they need to succeed.\n\nHealthcare policies can also have immediate and long-term impacts on individuals and communities. Universal healthcare coverage can improve health outcomes and reduce the financial burden on patients, while cuts to public health funding can lead to increased mortality rates and higher healthcare costs. Policies affecting access to clean water, sanitation, and vaccinations can prevent diseases and save lives.\n\nEnvironmental policies, such as those related to climate change, can impact public health and safety. For example, regulations on air and water pollution can improve living conditions and reduce health risks. Conversely, deregulation can lead to increased pollution and health hazards, affecting the most vulnerable populations the most.\n\nIn conclusion, policy decisions have significant human consequences that ripple through societies. Policymakers must carefully consider the impacts of their decisions on various groups and strive to create policies that balance economic growth with social welfare and public health."}, {"slot": "B", "text": "The human consequences of policy decisions, particularly those involving military action and international relations, have profound and immediate impacts on societies. On April 7, 2026, President Trump's post threatening the extinction of a civilization through military action against Iran sparked a significant political response. More than 85 Democratic lawmakers called for his removal, indicating a shift in the political landscape. This response underscores the immediate human impact of policy decisions, as seen in the swift and widespread reaction to Trump's threat.\n\nHowever, the policy decisions themselves, such as the expansion of NATO and the procurement obligations of new member states, have long-term implications. These decisions, made over decades and against the documented objections of diplomats and intelligence analysts, have laid the groundwork for the subsequent conflict in Ukraine. The expansion of NATO and the subsequent defense spending obligations have contributed to the militarization of the region. This long-term planning, driven by specific interests, has led to a situation where the downstream consequences of military actions are increasingly difficult to manage."}, {"slot": "C", "text": "Policy decisions have significant human consequences that can affect individuals, communities, and societies at large. When governments and policymakers make decisions, they often do so with the intention of improving conditions or solving problems, but the outcomes can be far-reaching and complex. For instance, economic policies can directly impact employment rates and income levels. If a country implements a policy that restricts foreign investment, it could lead to job losses and a reduction in economic growth, affecting the livelihoods of many people who depend on the workforce.\n\nSocial policies, such as welfare programs or healthcare reforms, can also have profound effects. The introduction of universal healthcare, for example, can improve access to medical care, potentially saving lives and improving public health. However, the implementation of such policies can also strain public budgets, requiring significant financial investment. This can lead to cuts in other areas, such as education or infrastructure, which can have negative consequences on other aspects of society.\n\nEnvironmental policies, like those aimed at reducing pollution or protecting natural resources, can protect public health and preserve the environment. Yet, they can also impose costs on industries and individuals, potentially leading to job losses in affected sectors. The transition can be difficult, and it may require support mechanisms to help those who are displaced or affected.\n\nIn conclusion, policy decisions have significant human consequences that can be both positive and negative. It is crucial for policymakers to carefully consider the potential impacts of their decisions and to have mechanisms in place to mitigate negative effects and support those who may be affected."}]}, {"id": "W06", "task": "Write the opening paragraph of an analysis of why sanctions rarely change a government's behavior.", "options": [{"slot": "A", "text": "Washington's broader theory that economic pressure through oil markets could generate the internal instability needed to change Putin's strategic calculus has been tested over three years. The stagnation it has produced is real and accumulating. The collapse it predicted has not arrived and, given Russia's structural reconfiguration toward Asian markets, shadow fleet logistics, and a war-footing fiscal architecture, is not visible on the horizon at any credible analytical range. At what point, if any, does sustained fiscal stress translate into the political pressure required to end the war on terms that do not reward the aggressor? Nobody yet knows where that threshold is. Nobody has demonstrated it exists."}, {"slot": "B", "text": "The analysis begins with a statement that highlights the common observation that sanctions, a tool of international diplomacy, are often deployed but rarely succeed in changing a target government's behavior."}, {"slot": "C", "text": "Sanctions, a cornerstone of international diplomacy, are frequently employed by global powers to exert pressure on regimes they view as hostile or non-compliant. However, the often-stated goal of sanctions to alter a government's behavior through economic coercion and diplomatic pressure is frequently thwarted by a complex array of factors. This analysis will explore the intricate reasons behind the infrequent success of sanctions in changing a regime's actions, delving into the limitations of sanctions as a tool for governance modification and the myriad challenges that complicate their effectiveness."}]}, {"id": "W07", "task": "Write about 250 words on how a state uses the language of security to justify surveillance of its own citizens.", "options": [{"slot": "A", "text": "The Indian government's response to the Supreme Court's ruling on spyware usage exemplifies how the state justifies surveillance of its own citizens. Initially, the government remained silent, neither filing an affidavit nor addressing the confirmed targets. This silence underscores the reluctance to acknowledge the use of such technologies. The Supreme Court's April 29 statement, however, changed the discourse. Instead of questioning the legitimacy of spyware, the court accepted it as a tool for national security. This acceptance moves the debate from whether the state should use spyware to whether specific targeting decisions are inappropriate. Yet, the court's decision to keep the technical panel's report sealed and the continued surveillance without public scrutiny reveal the structural issue: the Indian state lacks the legal architecture, oversight mechanisms, and transparency required for such a program. The government's actions and the court's response demonstrate that the state uses security language to justify surveillance, masking the structural flaws in its mechanisms."}, {"slot": "B", "text": "States often employ the language of security to justify surveillance of their citizens, framing it as a necessary measure to protect against threats both internal and external. The language of security is a powerful tool that can obscure the nature of surveillance and its implications on individual freedoms. When governments use this language, they often highlight specific threats such as terrorism, cyber attacks, and economic espionage. These threats are presented as existential dangers that require a robust response, which in turn justifies extensive surveillance activities.\n\nFor instance, governments might argue that mass surveillance is essential to prevent terrorist attacks. They might claim that without such measures, the threat posed by extremist groups could escalate, leading to mass casualties. The language of security here is used to create a sense of urgency and necessity, making it difficult for the public to question the legality or morality of the surveillance activities. Similarly, governments might argue that surveillance is necessary to combat cyber threats, such as hacking and espionage, which they portray as a growing and increasingly sophisticated threat to national security.\n\nHowever, the language of security can also be misused to justify actions that infringe on privacy and civil liberties. For example, governments might claim that they need to monitor communications to prevent terrorism, but in reality, they may be collecting data on a large scale to track political dissidents or critics of the government. The language of security becomes a pretext for surveillance that is not always aligned with the actual threats facing the state.\n\nFurthermore, this language can lead to a culture of suspicion and fear among citizens. People might begin to doubt the actions of their neighbors, colleagues, and even family members, leading to social isolation and mistrust. The state's surveillance activities, cloaked in the language of security, can create an environment where individuals are constantly under scrutiny, which can have profound impacts on their lives and mental health.\n\nIn conclusion, the language of security is a double-edged sword. It can be a powerful tool for justifying extensive surveillance activities but can also be misused to justify actions that violate individual rights and freedoms. It is essential for citizens to critically evaluate the language used by their governments and to demand transparency and accountability in the surveillance practices."}, {"slot": "C", "text": "The language of security is often deployed by governments to justify extensive surveillance of their own citizens. This approach is not new and has been used to justify various forms of government control and control over public information. The government's use of security rhetoric is a powerful tool that can obscure the surveillance's true nature and the extent of its reach.\n\nWhen governments speak of security, they often describe it in terms of protecting against threats that are both internal and external. The external threats are typically those that are more easily identified and quantifiable, such as terrorism, espionage, and foreign cyber attacks. The internal threats, on the other hand, are more abstract and harder to measure, such as domestic terrorism, organized crime, and the spread of misinformation. By framing surveillance in terms of countering these threats, governments can create a narrative that justifies the collection of large amounts of data on their citizens.\n\nThe language of security is also used to suggest that the surveillance is a necessary evil. The government might argue that without such measures, the country would be at greater risk. This framing makes it difficult for citizens to question the surveillance's legality or the extent of the data collected. The government's position is that the security measures are essential for the protection of the state and its citizens, and any criticism is seen as a threat to national security.\n\nMoreover, the language of security can be used to downplay the privacy concerns. When citizens are told that the government is monitoring and collecting data to keep them safe, they are often not fully aware of how the data is collected, stored, and used. The government might claim that the data is collected for a specific purpose and is not used for unrelated activities. This language can make it difficult for citizens to understand the full scope of the surveillance and its implications on their privacy.\n\nIn summary, the language of security is a powerful tool that governments use to justify extensive surveillance of their citizens. It is a narrative that can obscure the surveillance's true nature and the extent of its reach, making it difficult for citizens to question the measures."}]}, {"id": "W08", "task": "Write the opening paragraph of an analysis of how great powers compete for influence through ports and shipping lanes.", "options": [{"slot": "A", "text": "The strategic competition among great powers for control over ports and shipping lanes has been a constant feature of international relations throughout history. These maritime chokepoints are not merely conduits for trade; they are the arteries through which great powers exert their influence, control, and power. The control over these vital maritime routes can determine the flow of goods and information, thereby affecting the economic and military balance of power between competing states."}, {"slot": "B", "text": "The United States and China vie for dominance in global maritime infrastructure, with the US Maritime Action Plan and the Maritime Security Trust Fund designed to replace Chinese-built ports and terminals. The US seeks to control the sea lanes through the construction of a supply chain over which no Chinese-built vessel, terminal, or carrier can transit without paying a toll. This is achieved through the US-flagged vessels and insurance, and the US's ability to tax Chinese-linked operators with every port call. The US's petrodollar arrangement, now replaced by physical dominance, ensures that the US can dictate the terms of energy trade. In India, the war against Iran has led to a significant increase in the cost of LPG cylinders, with the price hike of Rs 60 for a domestic cylinder and Rs 114.50 for a commercial one, reflecting the US's influence over global energy markets."}, {"slot": "C", "text": "In the intricate dance of global power dynamics, great powers often vie for supremacy not just on land, but also in the vast expanse of the seas and oceans, where ports and shipping lanes serve as strategic gateways for economic dominance and military might. As maritime routes become increasingly vital conduits for trade and military movements, the control and influence over these critical chokepoints have become paramount in the geopolitical landscape, shaping the strategies and alliances of nations across the globe."}]}, {"id": "W09", "task": "Write about 250 words on why international institutions apply their rules unevenly to allies and rivals.", "options": [{"slot": "A", "text": "International institutions, such as the International Court of Justice, the International Monetary Fund, and the World Health Organization, are designed to enforce rules and standards that are meant to be applied equally to all member countries, regardless of their political alignment. However, in practice, there are often significant differences in how these institutions apply their rules to allies and rivals.\n\nThe primary reason for this uneven application is the political influence that member countries exert on the institutions. Countries that are considered allies may have more leverage in shaping the policies and decisions of international organizations. For example, the United States, a long-standing ally, often has a significant voice in the IMF, where it can influence the allocation of funds and the design of economic programs. The same cannot always be said for its rivals, where the balance of power can lead to decisions that are more favorable to the institution's more powerful members.\n\nAnother factor is the specific nature of the rules being applied. Some rules are more flexible and allow for greater interpretation and application based on the specific circumstances of the member countries. For instance, the World Health Organization's guidelines on disease control and prevention are more likely to be applied uniformly to all member states. However, when it comes to more sensitive issues like sanctions or trade tariffs, the application can be more discretionary, with countries that are considered allies facing less severe consequences.\n\nThe political climate and the current relationships between member states also play a significant role. When a country is a rival, it may be more difficult for the institution to take action against it, as the institution's own political structure can be influenced by the balance of power between member states. This can result in a situation where the institution's rules are applied more strictly to allies who are seen as more cooperative and less strictly to rivals who are viewed as more problematic.\n\nIn summary, while international institutions are designed to apply rules uniformly, the reality is more complex. The application of rules is not only influenced by the political power of member states but also by the specific nature of the rules and the balance of power within the institution itself."}, {"slot": "B", "text": "International institutions apply their rules unevenly to allies and rivals. The US administration under Trump imposed 25 percent tariffs on imported steel from Canada, the European Union, Japan, and South Korea, citing national security grounds. These tariffs were applied inconsistently and lasted for years. Similarly, the Biden administration imposed tariffs on China, but it also passed the Inflation Reduction Act and the CHIPS and Science Act, explicitly conditioning subsidies on domestic production. This message was clear: the US would apply economic coercion against allies and rivals alike. Such inconsistent application of rules undermines the trust and predictability essential for international cooperation."}, {"slot": "C", "text": "International institutions, such as the International Monetary Fund (IMF), World Trade Organization (WTO), and United Nations, are designed to enforce rules and norms that apply to all member states equally. However, in practice, these institutions often apply their rules unevenly to allies and rivals, leading to significant discrepancies and criticisms. This uneven application can be attributed to a variety of factors, including political influence, economic interests, and strategic alliances.\n\nFirstly, political influence plays a crucial role in how international institutions enforce their rules. Member states with stronger political clout can exert significant pressure on the institutions to interpret rules in their favor. For instance, countries with close diplomatic relations might be granted more lenient interpretations of trade regulations or more favorable terms in financial agreements. Conversely, countries with poor relations might face harsher penalties or sanctions. This dynamic creates a clear bias in the application of rules, favoring allies and penalizing rivals.\n\nSecondly, economic interests also significantly impact the application of international rules. Wealthier countries often have more leverage in negotiations and can afford to pay fines or penalties. For example, the IMF's rules require member countries to repay loans, but the ability to do so varies greatly based on a country's economic strength. Countries facing financial difficulties might be more likely to face sanctions or penalties, while those with robust economies can often negotiate more favorable terms. This disparity in economic capacity further exacerbates the uneven application of rules.\n\nFurthermore, strategic alliances can also influence the enforcement of international rules. Countries that are part of a strong alliance might receive more lenient treatment from international institutions due to the alliance's collective bargaining power. Conversely, countries that are seen as threats or pose significant challenges to the alliance might face harsher sanctions. This strategic aspect further complicates the application of rules, ensuring that allies receive more favorable treatment.\n\nIn conclusion, while international institutions are designed to be impartial and apply rules uniformly, the reality often reveals significant discrepancies in how these rules are applied. Political influence, economic interests, and strategic alliances all contribute to this uneven application, creating a complex landscape where allies and rivals are treated differently. Understanding these dynamics is crucial for comprehending the complexities of international governance and the challenges faced by international institutions."}]}, {"id": "W10", "task": "Write the opening paragraph of an analysis of how a media ecosystem shapes what a public believes about a distant war.", "options": [{"slot": "A", "text": "The media ecosystem plays a pivotal role in how a public perceives and interprets information about distant wars, influencing not only the public's understanding but also their emotional response and political stance. The way a war is covered, the sources of information, and the framing of the conflict all contribute to the public's collective narrative, shaping what they believe about the war's nature, the causes, and the potential outcomes."}, {"slot": "B", "text": "The media ecosystem that frames the status quo as the natural law of the universe operates through far gentler means than direct censorship. Instead, it establishes boundaries of acceptable debate so effectively that they are mistaken for the edges of reality itself. This manufactured consent, however, is not neutral. It is shaped by the domestic settlement in Western capitals, where compliance is achieved through subtle coercion rather than overt force. The ballot box, a master key to the core public, often fails to reflect the true nature of power. When national policy remains constant regardless of which political party wins an election, the electorate assumes real power lies outside democratic control. This belief, however, is a mechanism of the installed class, a population that polices itself and votes for the continuation of its own management. The media apparatus, a domestic version of the installed class, operates through far gentler means, establishing boundaries of acceptable debate that are mistaken for the edges of reality itself. The manufactured consent, therefore, is not merely a reflection of reality but a tool of the installed class, maintaining the status quo and reinforcing the illusion of compliance."}, {"slot": "C", "text": "In the intricate landscape of global communication, the media ecosystem plays a pivotal role in shaping public perception of distant wars, influencing how distant conflicts are perceived and understood by audiences. As information travels across borders and continents, the role of media becomes paramount in translating complex geopolitical narratives into digestible narratives that resonate with diverse publics. This analysis explores how the structure and dynamics of the media ecosystem, including the various platforms, sources, and filters, interact to create a mosaic of perspectives that collectively form the public's understanding of these far-off conflicts."}]}, {"id": "W11", "task": "Write about 250 words on the gap between a government's stated foreign policy and the arms sales it approves.", "options": [{"slot": "A", "text": "The gap between a government's stated foreign policy and its actual arms sales practices is a significant issue that often highlights the disconnect between a country's proclaimed international commitments and its actions. Many governments claim to support global peace and security through diplomatic channels and international agreements, yet their actions through arms sales reveal a more complex and often contradictory reality.\n\nFor instance, a country might publicly advocate for disarmament and non-proliferation, emphasizing its commitment to global security. However, behind closed doors, it may engage in extensive arms sales to countries that are not adhering to these same principles. This discrepancy can be particularly stark when a country's arms exports are directed towards regimes that are known for human rights abuses or are involved in conflicts that undermine regional stability. Such practices can undermine the very principles the government claims to uphold.\n\nMoreover, the gap can also reflect broader geopolitical interests. Countries may sell arms to allies or partners in strategically important regions, even if these partners are not aligned with the government's stated foreign policy. For example, a country might sell sophisticated weaponry to a nation that is part of a coalition against a common adversary, but this same country might also be involved in human rights violations or territorial disputes. Such dual-use arms sales can blur the line between support for peace and security and support for authoritarian regimes.\n\nThe consequences of this gap are far-reaching. It can lead to a perception of hypocrisy and double standards, damaging a country's credibility on the global stage. It can also contribute to regional tensions and conflicts, as countries with poor human rights records or unstable governments may use the arms they purchase to further their own agendas. Addressing this gap requires a more nuanced approach, involving not just diplomatic efforts but also robust monitoring and enforcement mechanisms to ensure that arms sales align with a country's stated foreign policy goals."}, {"slot": "B", "text": "Washington's foreign policy and its arms sales approval process are deeply intertwined, with the state leasing its sovereign authority to private entities. Funding from defense contractors and foreign governments flows into think tanks and policy centers, where they produce papers urging immediate military interventions. These papers are not independent scholarship but commercial sales prospectuses disguised as strategic intelligence. Government officials move fluidly between the private sector and the public sector, often serving as consultants, policy advisors, and then re-entering government roles. This revolving door ensures that the state's authority is not controlled but leased to private interests. The same individuals who approve defense purchases are frequently the same individuals who fund these policy centers. This creates a situation where the state's actions are influenced by private sector interests, leading to a disconnect between the government's stated policy and its actual actions."}, {"slot": "C", "text": "The gap between a government's stated foreign policy and its actual arms sales practices is a significant and often overlooked issue in international relations. A country's official foreign policy is often designed to promote its national interests and values, but the reality of its arms sales can sometimes reveal a different agenda. For instance, a government might declare a commitment to peace and disarmament, while simultaneously engaging in arms sales to countries that are part of its strategic coalition or facing internal conflicts. This discrepancy can be particularly evident when a government's policy is in direct conflict with its actions.\n\nThe United States, for example, has a stated policy of reducing its nuclear arsenal and promoting global disarmament. However, the country's record on arms sales is a different story. The US has sold billions of dollars worth of weapons to countries that are not aligned with its strategic interests, including Russia, which has been involved in conflicts against Ukraine. This situation highlights how the gap between policy and practice can be a source of international tension and moral inconsistency.\n\nThe gap also exists in the context of humanitarian concerns. A government might claim to support human rights and humanitarian values, but its arms sales to countries with poor human rights records can be seen as a double standard. The sale of weapons to countries where there is a documented record of human rights abuses can be a direct violation of the stated policy of protecting human rights.\n\nThe issue is not limited to the United States. Other countries also face this dilemma. The European Union, for example, has a policy of promoting arms control and disarmament, but its arms sales to countries like Saudi Arabia, which has been involved in the Yemen conflict, have raised questions about the consistency between its stated policy and its actions.\n\nThe gap between policy and practice in arms sales is a complex issue that requires careful consideration. It is not just about the economic implications of military spending but also about the moral and ethical implications of a country's foreign policy."}]}, {"id": "W12", "task": "Write the closing paragraph of an analysis arguing that debt can be an instrument of political leverage between states.", "options": [{"slot": "A", "text": "In conclusion, the analysis demonstrates that debt can serve as a potent instrument of political leverage between states. By strategically accumulating debt, a state can exert significant influence over another, potentially altering the balance of power in international relations. This leverage is not only a function of the economic strength a state can exert through its debt but also a reflection of the diplomatic and strategic capabilities it possesses. The use of debt as a tool for leverage underscores the complex and sometimes adversarial nature of state interactions in the global arena."}, {"slot": "B", "text": "Across the analyses, the Financial, Military, and Technological complexes operate as one machine, leveraging geopolitical dependencies to enforce debt extraction. The petrodollar's fracture intensifies competition between capital systems, and the Installed Class enforces these arrangements through public relations departments that package the arrangement in moral and religious language. Dependency between states creates a dynamic where financial leverage is a potent tool of political coercion. Washington humbles its clients most openly when it needs them most, demonstrating that the junior partner has already paid, the war is already running, and the base is already occupied. Such practices suggest that debt can be an instrument of political leverage between states, where the cost of renegotiation is borne by those least able to resist."}, {"slot": "C", "text": "In conclusion, debt emerges as a potent tool of political leverage among states, exerting significant influence over international relations and diplomatic strategies. The ability to leverage debt creates a powerful asymmetric relationship, where the creditor state can exert considerable influence over the debtor state, affecting its policies and actions. This phenomenon underscores the importance of understanding the dynamics of debt in geopolitical landscapes, highlighting the need for more nuanced approaches to international finance and diplomacy."}]}];const choices={};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const update=()=>{document.getElementById('count').textContent=`${Object.keys(choices).length} of ${items.length} chosen`;document.querySelectorAll('.opt').forEach(n=>n.classList.toggle('chosen',choices[n.dataset.task]===n.dataset.slot))};
document.querySelectorAll('.opt button').forEach(b=>b.onclick=()=>{const n=b.parentElement;choices[n.dataset.task]=n.dataset.slot;update()});
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(choices,null,2)],{type:'application/json'}));a.download='blind-choices.json';a.click()};
